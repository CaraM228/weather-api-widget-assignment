    <title>Weather API</title>
    <script src="script.js" type="module" defer></script>
</head>
<body>
    <main>
        <header>

            <button>°C / °F</button>

            <h2>Monday</h2>

            <p>Clear skies</p>
        </article>

        <article>
            <h2>Tuesday</h2>
            <div class="weather-icon"></div>
            <p>15°c</p>
            <p>Clear skies</p>
        </article>

        <article>
            <h2>Wednesday</h2>
            <div class="weather-icon"></div>
            <p>15°c</p>
            <p>Clear skies</p>
        </article>
        </div>

    </main>
</body>
</html>
