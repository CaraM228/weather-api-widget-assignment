<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link href="./output.css" rel="stylesheet">
    <script src="script.js" type="module" defer></script>
</head>
<body class="bg-sky-400 max-w-6xl mx-auto">
    <main>
        <header class="bg-blue-400 grid grid-cols-2">
            <h1 class="text-center text-2xl md:text-4xl font-bold">Weather Forecast in Calgary</h1>
            <button id="toggle-btn" class="bg-white justify-self-center rounded-lg px-2">°C / °F</button>
        </header>

        <div class="weather-card-container grid grid-cols-1 md:grid-cols-3 gap-6 mt-8 px-4">
        <article class="weather-card bg-white border border-black rounded-lg shadow-2xl p-4 text-center">
            <h2 class="day">Monday</h2>
            <p class="date">date</p>
            <div class="weather-icon"></div>
            <p class="temp">15°c</p>
            <p class="condition">Clear skies</p>
        </article>

        <article class="weather-card bg-white border border-black rounded-lg shadow-2xl p-4 text-center">
            <h2 class="day">Tuesday</h2>
            <p class="date">date</p>
            <div class="weather-icon"></div>
            <p class="temp">15°c</p>
            <p class="condition">Clear skies</p>
        </article>

        <article class="weather-card bg-white border border-black rounded-lg shadow-2xl p-4 text-center">
            <h2 class="day">Wednesday</h2>
            <p class="date">date</p>
            <div class="weather-icon"></div>
            <p class="temp">15°c</p>
            <p class="condition">Clear skies</p>
        </article>
        </div>
    </main>
</body>
</html>
